<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataForge Pro — 一键数据处理工具套件</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">⚡</span>
    <div>
      <h1>DataForge <span class="pro">Pro</span></h1>
      <p class="tagline">浏览器端一键数据处理套件 · 100% 本地运行 · 隐私安全</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="lang-toggle" id="langToggle">EN</button>
    <div class="license-badge" id="licenseBadge">🔓 未激活 (试用)</div>
  </div>
</header>

<main class="dashboard">
  <section class="hero">
    <h2>选择一个工具开始</h2>
    <p>所有处理都在你的浏览器中完成，数据永不上传服务器。</p>
    <input type="text" id="toolSearch" placeholder="🔍 搜索工具（例如：CSV、去重、Excel、JSON…）">
  </section>

  <div class="tool-grid" id="toolGrid"></div>
</main>

<footer class="footer">
  <p><span class="copyright">DataForge Pro v1.0 · © 2026</span> · <a href="#" id="licenseLink">输入许可证密钥</a></p>
</footer>

<!-- License Modal -->
<div class="modal-overlay" id="licenseModal" hidden>
  <div class="modal">
    <h3>激活 DataForge Pro</h3>
    <p>请输入你从 Gumroad 购买后收到的许可证密钥。</p>
    <input type="text" id="licenseInput" placeholder="DFP-XXXX-XXXX-XXXX">
    <div class="modal-actions">
      <button class="btn-secondary" id="closeLicense">取消</button>
      <button class="btn-primary" id="activateLicense">激活</button>
    </div>
    <p class="license-hint" id="licenseHint"></p>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/tools-data.js"></script>
<script src="assets/js/license.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
